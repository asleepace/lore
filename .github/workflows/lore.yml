name: Lore

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository's own graph, checked by its own action.
      - uses: ./
        with:
          policy: warn

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun run build && node dist/lore.js -C .. lint
